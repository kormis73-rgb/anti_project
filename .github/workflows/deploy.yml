name: Deploy to AWS S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::448895342454:role/GitHubActions-AWS-Role
          aws-region: ap-northeast-2

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://anti-project-bucket --delete --exclude ".git*" --exclude ".github*"
